<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illuminati Boy SignalFx - IA para Trading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
            color: #fff;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0a0e27;
            font-size: 14px;
        }

        .menu-icon {
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
        }

        .menu-icon span {
            width: 24px;
            height: 2px;
            background: #00d4ff;
            border-radius: 1px;
        }

        /* Main Container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 60px);
            padding: 40px 20px;
            text-align: center;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 24px;
            padding: 12px 20px;
            margin-bottom: 32px;
            font-size: 13px;
            color: #7dd3fc;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Title */
        h1 {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .highlight {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            font-size: 56px;
            margin: 12px 0;
        }

        /* Subtitle */
        .subtitle {
            font-size: 16px;
            color: #9ca3af;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Pills */
        .pills-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 48px;
        }

        .pill {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 24px;
            padding: 10px 24px;
            color: #00d4ff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pill:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.6);
            transform: translateY(-2px);
        }

        /* CTA Buttons */
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 300px;
        }

        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #0a0e27;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid rgba(0, 212, 255, 0.5);
            color: #00d4ff;
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
            transform: translateY(-2px);
        }

        .btn::after {
            content: ' >';
            margin-left: 8px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }

            .highlight {
                font-size: 42px;
            }

            .container {
                padding: 30px 16px;
                min-height: calc(100vh - 60px);
            }

            .pills-container {
                gap: 10px;
            }

            .pill {
                font-size: 13px;
                padding: 9px 18px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }

            .highlight {
                font-size: 32px;
            }

            .subtitle {
                font-size: 14px;
                margin-bottom: 32px;
            }

            .pills-container {
                margin-bottom: 36px;
            }

            .cta-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">ℹ️</div>
            <span>Illuminati Boy SignalFx</span>
        </div>
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div class="container">
        <div class="status-badge">
            <div class="status-dot"></div>
            Inteligência Artificial para Trading • Análise em Tempo Real
        </div>

        <h1>Opere com</h1>
        <div class="highlight">Preço de IA</div>

        <p class="subtitle">
            Análises técnicas, fundamentalistas e de timing avançadas. <strong>Saiba o que operar, quando entrar e onde sair.</strong><br>
            <br>
            Decisões baseadas em dados, não em emoção.
        </p>

        <div class="pills-container">
            <div class="pill">Forex</div>
            <div class="pill">Crypto</div>
        </div>

        <div class="cta-container">
            <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">Começar</button>
            <button class="btn btn-secondary" onclick="window.location.href='auth.html'">Ver Demonstração</button>
        </div>
    </div>
</body>
</html>
