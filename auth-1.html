<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wawa IA - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(15, 22, 41, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
        }
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 32px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 8px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #0a0e27;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #0a0e27;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 16px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 212, 255, 0.4);
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .link {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
        }
        .link a {
            color: #00d4ff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="tabs">
            <button class="tab active" data-tab="login">Entrar</button>
            <button class="tab" data-tab="signup">Criar Conta</button>
        </div>

        <div id="login" class="form-section active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" required>
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
            <div class="link">
                Não tem conta? <a onclick="switchTab('signup')">Criar agora</a>
            </div>
        </div>

        <div id="signup" class="form-section">
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <input type="password" minlength="8" required>
                </div>
                <button type="submit" class="btn-submit">Criar Conta</button>
            </form>
            <div class="link">
                Já tem conta? <a onclick="switchTab('login')">Entrar aqui</a>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });

        function switchTab(name) {
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            document.querySelector(`[data-tab="${name}"]`).classList.add('active');
        }

        function handleLogin(e) {
            e.preventDefault();
            alert('Login enviado!');
        }

        function handleSignup(e) {
            e.preventDefault();
            alert('Conta criada!');
        }
    </script>
</body>
</html>
