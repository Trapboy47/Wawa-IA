<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wawa IA - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }
        header {
            padding: 16px 20px;
            background: rgba(10, 14, 39, 0.95);
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: #fff;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a0e27;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .api-section {
            background: rgba(15, 22, 41, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            max-width: 600px;
        }
        .api-section label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
            margin-bottom: 8px;
        }
        .api-input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .api-section input {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 12px;
        }
        .api-section input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.08);
        }
        .api-section button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #0a0e27;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .api-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }
        .api-status {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }
        .api-status.connected {
            color: #00ff88;
        }
        .signals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }
        .signal-card {
            background: rgba(15, 22, 41, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }
        .signal-card.buy {
            border-top: 3px solid #00ff88;
        }
        .signal-card.sell {
            border-top: 3px solid #ff4444;
        }
        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .signal-symbol {
            font-size: 20px;
            font-weight: 700;
        }
        .signal-type {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .signal-type.buy {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
        }
        .signal-type.sell {
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
        }
        .signal-price {
            font-size: 16px;
            color: #7dd3fc;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }
        .signal-table {
            width: 100%;
            margin-bottom: 16px;
        }
        .signal-table tr {
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }
        .signal-table td {
            padding: 12px 0;
            font-size: 13px;
        }
        .signal-table td:first-child {
            color: #9ca3af;
        }
        .signal-table td:last-child {
            text-align: right;
            color: #00d4ff;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }
        .signal-footer {
            display: flex;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
        }
        .signal-info {
            flex: 1;
            font-size: 12px;
            color: #6b7280;
        }
        .signal-info strong {
            color: #d1d5db;
            display: block;
            margin-bottom: 2px;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #86efac;
        }
        @media (max-width: 768px) {
            .signals-grid {
                grid-template-columns: 1fr;
            }
            .api-input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">W</div>
            <span>Wawa IA</span>
        </div>
    </header>

    <div class="container">
        <h1>Sinais SMC em Tempo Real</h1>
        <p class="subtitle">Análise XAU/USD e US100 com Inteligência Artificial</p>

        <div class="api-section">
            <label>🔑 Chave Twelve Data API</label>
            <div class="api-input-group">
                <input type="password" id="apiKey" placeholder="Cole sua chave">
                <button onclick="saveApiKey()">Conectar</button>
            </div>
            <div id="apiStatus" class="api-status">Pressione Conectar para começar</div>
        </div>

        <div id="messageContainer"></div>
        <div id="loadingContainer" style="display: none;"><div class="loader"></div></div>
        <div id="signalsContainer" class="signals-grid"></div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('wawa_api_key');
            if (saved) {
                document.getElementById('apiKey').value = saved;
                document.getElementById('apiStatus').textContent = '✓ Conectado';
                document.getElementById('apiStatus').classList.add('connected');
                loadSignals();
            }
        });

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (!key) {
                showMessage('Cole sua chave API', 'error');
                return;
            }
            localStorage.setItem('wawa_api_key', key);
            document.getElementById('apiStatus').textContent = '✓ Conectado';
            document.getElementById('apiStatus').classList.add('connected');
            showMessage('Chave salva!', 'success');
            loadSignals();
        }

        async function loadSignals() {
            const key = localStorage.getItem('wawa_api_key');
            if (!key) {
                showMessage('Conecte sua chave API', 'error');
                return;
            }

            const loading = document.getElementById('loadingContainer');
            const container = document.getElementById('signalsContainer');
            loading.style.display = 'block';
            container.innerHTML = '';

            try {
                const xau = await fetch(`https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=4h&apikey=${key}&outputsize=50`).then(r => r.json());
                const us100 = await fetch(`https://api.twelvedata.com/time_series?symbol=NDX&interval=4h&apikey=${key}&outputsize=50`).then(r => r.json());

                loading.style.display = 'none';

                if (xau.values) renderSignal(analyzeSMC(xau.values, 'XAU/USD'));
                if (us100.values) renderSignal(analyzeSMC(us100.values, 'US100'));

                if (!xau.values && !us100.values) {
                    showMessage('Erro na API: ' + (xau.message || us100.message || 'verifique a chave'), 'error');
                }
            } catch (e) {
                loading.style.display = 'none';
                showMessage('Erro ao buscar dados: ' + e.message, 'error');
            }
        }

        function analyzeSMC(candles, symbol) {
            const recent = candles.slice(0, 5);
            const prices = recent.map(c => parseFloat(c.close));
            const trend = prices[0] > prices[1] ? 'UP' : 'DOWN';

            const type = trend === 'UP' ? 'BUY' : 'SELL';
            const price = prices[0];
            const entry = price;
            const sl = type === 'BUY' ? price - 50 : price + 50;
            const tp = type === 'BUY' ? price + 100 : price - 100;

            return { symbol, type, price, entry, sl, tp };
        }

        function renderSignal(signal) {
            const rr = ((signal.tp - signal.entry) / Math.abs(signal.entry - signal.sl)).toFixed(1);
            const html = `
                <div class="signal-card ${signal.type === 'BUY' ? 'buy' : 'sell'}">
                    <div class="signal-header">
                        <div class="signal-symbol">${signal.symbol}</div>
                        <div class="signal-type ${signal.type === 'BUY' ? 'buy' : 'sell'}">${signal.type}</div>
                    </div>
                    <div class="signal-price">Preço: ${signal.price.toFixed(2)}</div>
                    <table class="signal-table">
                        <tr><td>Entrada</td><td>${signal.entry.toFixed(2)}</td></tr>
                        <tr><td>Stop Loss</td><td style="color: #ff4444;">${signal.sl.toFixed(2)}</td></tr>
                        <tr><td>Take Profit</td><td style="color: #00ff88;">${signal.tp.toFixed(2)}</td></tr>
                        <tr><td>Risk/Reward</td><td>1:${rr}</td></tr>
                    </table>
                </div>
            `;
            document.getElementById('signalsContainer').insertAdjacentHTML('beforeend', html);
        }

        function showMessage(msg, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = msg;
            document.getElementById('messageContainer').innerHTML = '';
            document.getElementById('messageContainer').appendChild(div);
        }
    </script>
</body>
</html>
