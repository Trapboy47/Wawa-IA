<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wawa IA - Login</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#00c6ff">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #0a1128 0%, #0d1b3e 100%);
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 400px;
        background: rgba(15, 25, 55, 0.6);
        border: 1px solid rgba(0, 200, 255, 0.2);
        border-radius: 16px;
        padding: 30px;
    }

    .tabs {
        display: flex;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 25px;
    }

    .tab {
        flex: 1;
        padding: 12px;
        border: none;
        background: transparent;
        color: #8a94b3;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .tab.active {
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        color: #06122b;
    }

    .form-section {
        display: none;
    }

    .form-section.active {
        display: block;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        color: #cfd6e8;
        font-size: 14px;
        margin-bottom: 6px;
    }

    .form-group input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid rgba(0, 200, 255, 0.25);
        background: rgba(6, 12, 30, 0.8);
        color: #ffffff;
        font-size: 15px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #00c6ff;
    }

    .btn-submit {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        color: #06122b;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 5px;
    }

    .btn-submit:hover {
        opacity: 0.9;
    }

    .link {
        text-align: center;
        margin-top: 18px;
        color: #8a94b3;
        font-size: 14px;
    }

    .link a {
        color: #00c6ff;
        cursor: pointer;
        font-weight: 600;
        text-decoration: none;
    }
</style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab active" data-tab="login">Entrar</button>
        <button class="tab" data-tab="signup">Criar Conta</button>
    </div>

    <div id="login" class="form-section active">
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" required>
            </div>
            <button type="submit" class="btn-submit">Entrar</button>
        </form>
        <div class="link">
            Não tem conta? <a onclick="switchTab('signup')">Criar agora</a>
        </div>
    </div>

    <div id="signup" class="form-section">
        <form onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" minlength="8" required>
            </div>
            <div class="form-group">
                <label>Confirmar Senha</label>
                <input type="password" minlength="8" required>
            </div>
            <button type="submit" class="btn-submit">Criar Conta</button>
        </form>
        <div class="link">
            Já tem conta? <a onclick="switchTab('login')">Entrar</a>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    function switchTab(name) {
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        document.querySelector(`[data-tab="${name}"]`).classList.add('active');
    }

    function handleLogin(e) {
        e.preventDefault();
        window.location.href = 'painel-2.html';
    }

    function handleSignup(e) {
        e.preventDefault();
        alert('Conta criada com sucesso!');
        window.location.href = 'painel-2.html';
    }
</script>

</body>
</html>
