<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illuminati Boy SignalFx - Criar Conta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            padding: 16px 20px;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0a0e27;
            font-size: 14px;
        }

        /* Main Container */
        .auth-wrapper {
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
        }

        /* Card */
        .auth-card {
            background: rgba(15, 22, 41, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Tabs */
        .tab-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px;
            border-radius: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #0a0e27;
        }

        /* Promo Badge */
        .promo-banner {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 153, 204, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 28px;
            text-align: center;
        }

        .promo-label {
            font-size: 12px;
            color: #7dd3fc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .promo-code {
            font-size: 18px;
            font-weight: 700;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
        }

        /* Form Section */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Form Group */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
            margin-bottom: 8px;
            text-transform: capitalize;
        }

        input, select {
            width: 100%;
            padding: 13px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        input::placeholder {
            color: #6b7280;
        }

        input[type="password"] {
            letter-spacing: 2px;
        }

        /* Checkbox */
        .checkbox-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 16px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 3px;
            accent-color: #00d4ff;
            cursor: pointer;
        }

        .checkbox-label {
            margin: 0;
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.5;
        }

        .checkbox-label a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 500;
        }

        .checkbox-label a:hover {
            text-decoration: underline;
        }

        /* Button */
        .btn-submit {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #0a0e27;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 212, 255, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            font-size: 12px;
            color: #6b7280;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 212, 255, 0.15);
        }

        /* Social */
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-social {
            padding: 13px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-social:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.08);
        }

        /* Auth Link */
        .auth-link {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
        }

        .auth-link a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        /* Error Message */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 20px;
            }

            .promo-banner {
                padding: 12px;
                margin-bottom: 20px;
            }

            .promo-code {
                font-size: 16px;
            }

            input, select {
                font-size: 16px;
                padding: 14px 16px;
            }

            .tab-btn {
                padding: 10px 16px;
                font-size: 13px;
            }

            .social-buttons {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">ℹ️</div>
                <span>Illuminati Boy SignalFx</span>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-card">
                <!-- Tabs -->
                <div class="tab-buttons">
                    <button class="tab-btn" data-tab="login">Entrar</button>
                    <button class="tab-btn active" data-tab="signup">Criar Conta</button>
                </div>

                <!-- Login Section -->
                <div id="login" class="form-section">
                    <div class="error-message" id="loginError"></div>
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="seu@email.com" required>
                        </div>

                        <div class="form-group">
                            <label>Senha</label>
                            <input type="password" placeholder="Sua senha" required>
                        </div>

                        <button type="submit" class="btn-submit">Entrar na Plataforma</button>

                        <div class="divider">ou</div>

                        <div class="social-buttons">
                            <button type="button" class="btn-social">🔵 Google</button>
                            <button type="button" class="btn-social">🎮 Discord</button>
                        </div>
                    </form>

                    <div class="auth-link">
                        Não tem conta? <a onclick="switchTab('signup')">Criar agora</a>
                    </div>
                </div>

                <!-- Signup Section -->
                <div id="signup" class="form-section active">
                    <div class="error-message" id="signupError"></div>

                    <form onsubmit="handleSignup(event)">
                        <div class="form-group">
                            <label>Nome Completo</label>
                            <input type="text" id="fullname" placeholder="Seu nome completo" required>
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="email" placeholder="seu@email.com" required>
                        </div>

                        <div class="form-group">
                            <label>Senha</label>
                            <input type="password" id="password" placeholder="Min. 8 caracteres" minlength="8" required>
                        </div>

                        <div class="form-group">
                            <label>Confirmar Senha</label>
                            <input type="password" id="confirmPassword" placeholder="Confirme a senha" minlength="8" required>
                        </div>

                        <div class="form-group">
                            <label>País</label>
                            <select id="country" required>
                                <option value="">Selecione seu país</option>
                                <option value="MZ">🇲🇿 Moçambique</option>
                                <option value="BR">🇧🇷 Brasil</option>
                                <option value="PT">🇵🇹 Portugal</option>
                                <option value="AO">🇦🇴 Angola</option>
                                <option value="ZA">🇿🇦 África do Sul</option>
                                <option value="Other">Outro</option>
                            </select>
                        </div>

                        <div class="checkbox-item">
                            <input type="checkbox" id="terms" required>
                            <label for="terms" class="checkbox-label">
                                Concordo com os <a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a>
                            </label>
                        </div>

                        <div class="checkbox-item">
                            <input type="checkbox" id="newsletter" checked>
                            <label for="newsletter" class="checkbox-label">
                                Quero receber análises, sinais e dicas sobre trading
                            </label>
                        </div>

                        <button type="submit" class="btn-submit">Criar Conta Grátis</button>

                        <div class="divider">ou</div>

                        <div class="social-buttons">
                            <button type="button" class="btn-social">🔵 Google</button>
                            <button type="button" class="btn-social">🎮 Discord</button>
                        </div>
                    </form>

                    <div class="auth-link">
                        Já tem conta? <a onclick="switchTab('login')">Entrar aqui</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'signup';

        // Set initial tab
        if (mode === 'login') {
            switchTab('login');
        }

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchTab(btn.dataset.tab);
            });
        });

        function switchTab(tabName) {
            // Hide all sections
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            // Show selected section
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

            // Clear errors
            document.getElementById('loginError').classList.remove('show');
            document.getElementById('signupError').classList.remove('show');
        }

        // Form handlers
        function handleLogin(e) {
            e.preventDefault();
            const email = e.target[0].value;
            const password = e.target[1].value;

            if (!email || !password) {
                showError('loginError', 'Preencha todos os campos');
                return;
            }

            console.log('Login:', { email, password });
            alert(`✓ Login realizado!\nEmail: ${email}`);
        }

        function handleSignup(e) {
            e.preventDefault();
            
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const country = document.getElementById('country').value;

            // Validations
            if (!fullname || !email || !password || !confirmPassword || !country) {
                showError('signupError', 'Preencha todos os campos obrigatórios');
                return;
            }

            if (password !== confirmPassword) {
                showError('signupError', 'As senhas não conferem');
                return;
            }

            if (password.length < 8) {
                showError('signupError', 'A senha deve ter no mínimo 8 caracteres');
                return;
            }

            // Success
            console.log('Signup:', {
                fullname,
                email,
                country,
                newsletter: document.getElementById('newsletter').checked
            });

            alert(`✓ Conta criada com sucesso!\nEmail: ${email}`);
        }

        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
